<!DOCTYPE html>
<html lang="it" class="h-full w-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simbiosi Silente</title>
    <!-- Caricamento di Tailwind CSS per lo stile -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Stile di base per il "quadro" scuro */
            background-color: #05050a;
            color: #f0f0f0;
            overflow: hidden; /* Nasconde lo scroll */
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        /* Piccolo overlay per le istruzioni */
        .controls-info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none; /* Non intercettare i click */
            transition: opacity 0.5s;
        }

        /* UI per il Debug Mode */
        .debug-indicator {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #22c55e; /* Green 500 */
            color: #000;
            padding: 4px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.875rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: opacity 0.3s;
        }

        /* --- UI PER CREAZIONE MANUALE --- */
        #creationToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            z-index: 20; /* Assicura che sia sopra a tutto */
        }
        #creationToggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        /* --- Pannelli UI (Log e Ispezione) --- */
        .ui-panel {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 280px; /* Larghezza standard per i pannelli */
            background: rgba(10, 10, 20, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            color: #fff;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        .ui-panel h3 {
            font-size: 1.125rem; /* text-lg */
            font-weight: bold;
            margin-bottom: 0.75rem; /* mb-3 */
        }

        #creationPanel label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.875rem;
            color: #aaa;
        }
        #creationPanel select, #creationPanel button {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin-bottom: 12px;
        }
        #creationPanel select option {
            background: #05050a;
            color: #fff;
        }
        #creationPanel button {
            background: #3a7fff;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        #creationPanel button:hover {
            background: #2a6fef;
        }

        /* Stile Pannello Log */
        #logPanelContainer {
            top: 20px;
            left: 20px;
            width: 350px; /* Più largo per i log */
            z-index: 20; /* Sopra tutto */
        }
        /* NUOVO Stile per Contatori */
        #logCounters {
            font-size: 0.875rem; /* text-sm */
            padding: 8px 4px;
            border-bottom: 1px solid #374151; /* gray-700 */
            display: flex;
            justify-content: space-around;
            background-color: #1f2937; /* gray-800 */
            border-radius: 6px 6px 0 0; /* Arrotonda solo in alto */
        }
        #logCounters span {
            font-weight: bold;
        }

        #logPanel {
            height: 400px;
            overflow-y: auto;
            background: #030712; /* gray-950 */
            border-radius: 6px;
            padding: 4px;
        }
        .log-entry {
            border-bottom: 1px dotted #374151; /* gray-700 */
            padding: 4px 6px;
            font-size: 0.75rem; /* text-xs */
            line-height: 1.4;
            word-break: break-word;
        }

        /* Stile Pannello Ispezione */
        #inspectionPanel .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem; /* text-sm */
            padding: 4px 0;
            border-bottom: 1px solid #374151; /* gray-700 */
        }
        #inspectionPanel .stat-row span:first-child {
            font-weight: bold;
            color: #9ca3af; /* gray-400 */
        }
        #inspectionPanel .stat-row span:last-child {
            font-weight: bold;
            font-family: monospace;
        }
        #inspectionClose {
            font-size: 1.5rem;
            line-height: 1;
            font-weight: bold;
            color: #9ca3af; /* gray-400 */
        }
        #inspectionClose:hover {
            color: #fff;
        }

    </style>
</head>
<body class="h-full w-full m-0 p-0">

    <!-- Il canvas dove vive la simulazione -->
    <canvas id="simCanvas"></canvas>

    <!-- Indicatore Debug Mode -->
    <div id="debugIndicator" class="debug-indicator hidden">MODALITÀ DEBUG (D)</div>

    <!-- UI Pausa (Nuovo) -->
    <div id="pauseIndicator" class="hidden" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 5rem; font-weight: bold; color: rgba(255, 255, 255, 0.5); z-index: 100; pointer-events: none; text-shadow: 2px 2px 4px #000;">
        PAUSA
    </div>

    <!-- Istruzioni per l'utente -->
    <div id="controlsInfo" class="controls-info">
        Click: Ispeziona / Aggiungi Energia | Click Lungo: Stimola | Tasti: D (Debug) | L (Log) | P (Pausa) | I (Info)
    </div>

    <!-- UI Creazione Manuale -->
    <div id="creationToggle">+</div>
    <div id="creationPanel" class="ui-panel hidden">
        <h3 class="text-lg font-bold mb-3">Crea Creatura</h3>
        
        <label for="selectTipo">Tipo:</label>
        <select id="selectTipo">
            <option value="Produttore">Produttore (Blu/Ciano)</option>
            <option value="Predatore">Predatore (Giallo/Arancio)</option>
        </select>

        <label for="selectForma">Forma:</label>
        <select id="selectForma">
            <option value="Cerchio">Cerchio</option>
            <option value="Serpente">Serpente</option>
            <option value="Flagello">Flagello</option>
        </select>

        <button id="createButton">Crea</button>
    </div>

    <!-- UI Pannello Log (Nuovo) -->
    <div id="logPanelContainer" class="ui-panel hidden">
        <h3>Registro Ecosistema (L)</h3>
        <!-- NUOVI Contatori qui -->
        <div id="logCounters">
            <span>Prede: <span id="count-produttori" class="text-blue-400">0</span></span>
            <span>Predatori: <span id="count-predatori" class="text-yellow-400">0</span></span>
            <span>Cibo: <span id="count-cibo" class="text-gray-400">0</span></span>
        </div>
        <div id="logPanel">
            <!-- Le voci di log verranno aggiunte qui -->
        </div>
    </div>

    <!-- UI Pannello Ispezione (Nuovo) -->
    <div id="inspectionPanel" class="ui-panel hidden">
        <div class="flex justify-between items-center mb-2">
            <h3 id="inspectionTitle">Info Creatura</h3>
            <button id="inspectionClose" title="Chiudi">&times;</button>
        </div>
        <div id="inspectionContent" class="space-y-1">
            <!-- I dettagli della creatura verranno inseriti qui -->
        </div>
    </div>


    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const debugIndicator = document.getElementById('debugIndicator');
        const logPanel = document.getElementById('logPanel'); // Pannello per i log
        const inspectionPanel = document.getElementById('inspectionPanel'); // Pannello per l'ispezione
        const inspectionContent = document.getElementById('inspectionContent');
        const inspectionTitle = document.getElementById('inspectionTitle');

        let creature = []; 
        let energiaPunti = []; 
        
        // Stato del Debug Mode
        let debugMode = false;
        let isPaused = false; // NUOVO: Stato di Pausa
        let creatureIdCounter = 0; // Per ID unici
        let selectedCreature = null; // Per l'ispezione

        // Timer per gestire la differenza tra click e click lungo
        let pressTimer = null;
        let pressStartTime = 0;
        
        // Costanti della simulazione
        const NUMERO_INIZIALE_CREATURE = 40; 
        const NUMERO_INIZIALE_ENERGIA = 150; 
        const COSTO_VITA_PER_FRAME = 0.05;
        const ENERGIA_PER_PELLET = 25; 
        const ENERGIA_PER_PREDA = 0.9; 
        const ENERGIA_CLICK = 10; 
        const MUTATION_RATE = 0.1; 
        const MUTATION_RATE_TIPO = 0.05; 
        const LONG_PRESS_DURATION = 400; // ms
        
        // PARAMETRI BILANCIAMENTO CHIAVE 
        const PREDATOR_COST_MULTIPLIER = 1.2; 
        const MAX_FATIGUE = 100; 
        const FATIGUE_FLEE_RATE = 1.0; 
        const FATIGUE_HUNT_RATE = 0.3; 
        const FATIGUE_RECOVERY_RATE_REST = 3.0; 
        const FATIGUE_RECOVERY_RATE_PELLET = 3.0; 

        // Costanti per la crescita, l'abbandono e la caccia
        const PREDATOR_GROWTH_THRESHOLD = 0.9; 
        const PREDATOR_SLOW_GROWTH_RATE = 0.05; 
        const GIVE_UP_THRESHOLD = 500; 
        const FATIGUE_HUNT_THRESHOLD = 70; 

        // NUOVE COSTANTI PER IL RIPOSO FORZATO (dal feedback utente)
        const ENERGY_REST_THRESHOLD = 30; // Energia sotto la quale si inizia il riposo forzato
        const ENERGY_RESUME_THRESHOLD = 50; // Energia sopra la quale si può ricominciare a muoversi
        
        // Tasso di recupero lento (20 / 0.15 / 60 FPS = 2.22s)
        const ENERGY_RECOVERY_RATE_RESTING = 0.15; 
        // Fine Nuove Costanti

        // NUOVA COSTANTE: Definisce le forme disponibili per la mutazione e la generazione casuale
        const FORMES_DISPONIBILI = ['Cerchio', 'Serpente', 'Flagello']; 
        
        // Funzione helper per numeri casuali
        function random(min, max) {
            return Math.random() * (max - min) + min;
        }
        
        // Funzione helper per la distanza
        function getDistance(x1, y1, x2, y2) {
            let dx = x1 - x2;
            let dy = y1 - y2;
            return Math.sqrt(dx * dx + dy * dy);
        }

        /**
         * NUOVA FUNZIONE: Aggiunge un messaggio al pannello di log
         * @param {string} message - Il messaggio da registrare
         * @param {string} color - Classe Tailwind per il colore (es. 'text-green-400')
         */
        function logMessage(message, color = 'text-gray-400') {
            // Non loggare se il pannello è nascosto, per performance
            if (document.getElementById('logPanelContainer').classList.contains('hidden')) {
                return;
            }

            const now = new Date();
            const timeString = now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            const entry = document.createElement('div');
            entry.className = `log-entry ${color}`;
            entry.innerHTML = `<span class="text-gray-500">[${timeString}]</span> ${message}`;

            // Aggiunge la nuova voce in cima
            logPanel.prepend(entry);

            // Limita il numero di voci a 100 per performance
            while (logPanel.children.length > 100) {
                logPanel.removeChild(logPanel.lastChild);
            }
        }

        /**
         * Classe per l'Energia Ambientale (ex Nutriente)
         * SPOSTATA QUI (PRIMA DI init) PER RISOLVERE IL ReferenceError
         */
        class EnergiaPellet {
            constructor(x, y) {
                this.x = x || random(0, canvas.width);
                this.y = y || random(0, canvas.height);
                this.size = random(1.5, 3);
                // MODIFICA: Aggiunta velocità per galleggiamento
                this.vx = random(-0.1, 0.1);
                this.vy = random(-0.1, 0.1);
            }

            // NUOVA FUNZIONE: Aggiorna posizione per galleggiare
            update() {
                this.x += this.vx;
                this.y += this.vy;

                // Rimbalzo lento sui bordi
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // Cambio leggero di direzione
                if (Math.random() < 0.05) {
                    this.vx += random(-0.05, 0.05);
                    this.vy += random(-0.05, 0.05);
                    // Limita velocità
                    this.vx = Math.max(-0.1, Math.min(0.1, this.vx));
                    this.vy = Math.max(-0.1, Math.min(0.1, this.vy));
                }
            }

            draw() {
                // Disegna il pellet (bioluminescente)
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200, 255, 255, 0.8)';
                
                // Effetto "glow"
                ctx.shadowColor = 'rgba(150, 255, 255, 0.8)';
                ctx.shadowBlur = 8;
                
                ctx.fill();
            }
        }


        /**
         * Classe per le Creature (ex FormaDiVita)
         */
        class Creatura {
            constructor(x, y, genetics) {
                this.id = creatureIdCounter++; // Assegna ID unico
                this.x = x;
                this.y = y;
                
                // Genetica (il "codice" semplice)
                if (genetics) {
                    this.genetics = genetics;
                } else {
                    // Creazione di un genoma casuale
                    const tipo = (Math.random() < 0.8) ? 'Produttore' : 'Predatore'; // 80% produttori
                    this.genetics = {
                        tipo: tipo,
                        // Blu/Ciano (Produttore) vs Arancione/Giallo (Predatore)
                        hue: (tipo === 'Produttore') ? random(180, 240) : random(30, 60), 
                        size: random(3, 8),
                        speed: random(0.5, 2),
                        sense: random(50, 150),
                        // Uso della costante globale
                        forma: FORMES_DISPONIBILI[Math.floor(Math.random() * FORMES_DISPONIBILI.length)],
                        tailLength: random(0.8, 1.5) // NUOVO GENE
                    };
                }
                
                this.color = `hsl(${this.genetics.hue}, 100%, 70%)`;
                this.energia = 100; // Energia iniziale
                this.energiaMax = this.genetics.size * 20;
                this.costoRiproduzione = this.genetics.size * 15;
                this.currentSize = this.genetics.size * 0.3; // Nasce piccolo
                
                // Movimento e Stato
                this.vx = random(-0.5, 0.5);
                this.vy = random(-0.5, 0.5);
                this.rotationAngle = random(0, Math.PI * 2); 
                this.segmenti = []; 
                this.fatigue = 0; // Gestito per Produttori e Predatori

                // Stato di caccia
                this.targetNutriente = null;
                this.targetCreatura = null; 
                this.fuggendoDa = null; 
                this.boostRiproduttivo = 0; 
                this.huntingTimer = 0; 
                
                // NUOVO STATO: Riposo forzato
                this.isResting = false; 
                this.wasResting = false; // Flag per loggare lo stop solo una volta

                if (this.genetics.forma === 'Serpente' || this.genetics.forma === 'Flagello') {
                    // MODIFICA: Lunghezza coda basata su genetica
                    this.numSegmenti = Math.floor(10 * this.genetics.tailLength);
                    for (let i = 0; i < this.numSegmenti; i++) {
                        this.segmenti.push({ x: this.x, y: this.y });
                    }
                }
            }

            /**
             * Crea un discendente con geni mutati
             */
            riproduci() {
                if (this.energia > this.costoRiproduzione * 1.5 && this.currentSize >= this.genetics.size * 0.8) { 
                    this.energia -= this.costoRiproduzione;
                    
                    // Mutazione
                    const newGenetics = { ...this.genetics };

                    // Muta Tipo? (raro)
                    if (Math.random() < MUTATION_RATE_TIPO) {
                        newGenetics.tipo = (this.genetics.tipo === 'Produttore') ? 'Predatore' : 'Produttore';
                        newGenetics.hue = (newGenetics.tipo === 'Produttore') ? random(180, 240) : random(30, 60);
                    } else {
                        // Muta Colore (normale)
                        if (Math.random() < MUTATION_RATE) newGenetics.hue = (this.genetics.hue + random(-15, 15)) % 360;
                    }
                    
                    if (Math.random() < MUTATION_RATE) newGenetics.size = Math.max(2, this.genetics.size + random(-1, 1));
                    if (Math.random() < MUTATION_RATE) newGenetics.speed = Math.max(0.5, this.genetics.speed + random(-0.3, 0.3));
                    if (Math.random() < MUTATION_RATE) newGenetics.sense = Math.max(30, this.genetics.sense + random(-10, 10));
                    // MODIFICA: Muta lunghezza coda
                    if (Math.random() < MUTATION_RATE) newGenetics.tailLength = Math.max(0.5, this.genetics.tailLength + random(-0.1, 0.1));
                    
                    // Muta Forma
                    if (Math.random() < MUTATION_RATE) {
                        // Uso della costante globale
                        newGenetics.forma = FORMES_DISPONIBILI[Math.floor(Math.random() * FORMES_DISPONIBILI.length)];
                    }

                    const figlio = new Creatura(this.x + random(-10, 10), this.y + random(-10, 10), newGenetics);
                    figlio.energia = this.costoRiproduzione * 0.5; // Il figlio eredita un po' di energia
                    creature.push(figlio);

                    // LOG
                    logMessage(`NASCITA: Creatura ${this.id} (${this.genetics.tipo}) ha generato ${figlio.id} (${figlio.genetics.tipo}).`, 'text-green-400');
                }
            }

            /**
             * Cerca cibo, prede e minacce e gestisce l'interazione
             */
            percepisciEInteragisci() {
                // Se in RIPOSO FORZATO:
                // 1. Vogliamo che la creatura veda il cibo per prepararsi al movimento.
                // 2. Non deve fuggire né cacciare.
                if (this.isResting) {
                    this.targetCreatura = null; 
                    this.fuggendoDa = null;
                    // Procede alla ricerca di cibo qui sotto, ma salta la caccia/fuga.
                }

                // Resetta i target che non sono necessari se il predatore è stanco o in riposo
                if (!this.isResting && this.fatigue < FATIGUE_HUNT_THRESHOLD) {
                    this.targetNutriente = null; 
                }
                
                
                if (this.genetics.tipo === 'Produttore') {
                    // --- LOGICA PRODUTTORE ---
                    let bestDistCibo = this.genetics.sense;
                    let bestDistMinaccia = this.genetics.sense;

                    // 1. Cerca Energia (Pellet) e Mangia
                    for (let i = energiaPunti.length - 1; i >= 0; i--) {
                        let pellet = energiaPunti[i];
                        let d = getDistance(this.x, this.y, pellet.x, pellet.y);

                        // Mangia pellet
                        if (!this.isResting && d < this.currentSize) { // Non si muove, ma può mangiare se il pellet è sopra di lui (molto raro)
                            let energiaGuadagnata = ENERGIA_PER_PELLET;
                            if (this.energia < this.energiaMax) {
                                this.energia = Math.min(this.energiaMax, this.energia + energiaGuadagnata);
                            } else if (this.currentSize < this.genetics.size) {
                                // Energia piena! Converti in crescita
                                this.currentSize = Math.min(this.genetics.size, this.currentSize + 0.1); 
                            }
                            energiaPunti.splice(i, 1);
                        } 
                        // Cerca il più vicino
                        else if (d < bestDistCibo) {
                            bestDistCibo = d;
                            this.targetNutriente = pellet; // IMP: Lo imposta anche se è in riposo
                        }
                    }

                    // 2. Cerca Minacce (solo se NON in riposo, altrimenti è immobile comunque)
                    if (!this.isResting) {
                        for (let altra of creature) {
                            if (altra === this) continue;
                            // Solo i predatori minacciano
                            if (altra.genetics.tipo === 'Predatore' && altra.currentSize > this.currentSize * 0.5) { 
                                let d = getDistance(this.x, this.y, altra.x, altra.y);
                                
                                // Se il predatore non è in riposo forzato
                                if (!altra.isResting && d < bestDistMinaccia) { 
                                    bestDistMinaccia = d;
                                    this.fuggendoDa = altra;
                                }
                            }
                        }
                    }

                } else {
                    // --- LOGICA PREDATORE ---

                    // 1. GESTIONE ABBANDONO (Give-Up) se stiamo già cacciando
                    if (this.targetCreatura) {
                        this.huntingTimer++;
                        let dist = getDistance(this.x, this.y, this.targetCreatura.x, this.targetCreatura.y);

                        // Condizione di Abbandono:
                        // La caccia fallisce solo se il predatore è stanco E ha perso di vista la preda
                        if (this.fatigue > FATIGUE_HUNT_THRESHOLD && this.huntingTimer > GIVE_UP_THRESHOLD) {
                             // o se la preda si è allontanata troppo (anche se sta riposando)
                             if (dist > this.genetics.sense * 1.5) { 
                                this.targetCreatura = null;
                                this.huntingTimer = 0;
                                // Aumenta la fatica per lo sforzo fallito, costringendo il riposo
                                this.fatigue = Math.min(MAX_FATIGUE, this.fatigue + 40); 
                             }
                        }
                    } else {
                        this.huntingTimer = 0; // Resetta se non c'è un target
                    }

                    // 2. CERCA PREDE (Priorità) - Solo se non stanco e non in riposo
                    let bestDistPreda = this.genetics.sense;
                    let foundNewTarget = false;

                    if (!this.isResting && this.fatigue < FATIGUE_HUNT_THRESHOLD) {
                        
                        for (let altra of creature) {
                            if (altra === this || altra.genetics.tipo === 'Predatore') continue;

                            let d = getDistance(this.x, this.y, altra.x, altra.y);

                            // CHECK CATTURA
                            if (d < this.currentSize * 2.0 && this.currentSize > altra.currentSize) { 
                                
                                // CATTURA!
                                let energiaGuadagnata = altra.energia * ENERGIA_PER_PREDA;
                                if (this.energia < this.energiaMax) {
                                    this.energia = Math.min(this.energiaMax, this.energia + energiaGuadagnata);
                                } else if (this.currentSize < this.genetics.size) {
                                    this.currentSize = Math.min(this.genetics.size, this.currentSize + 0.2); 
                                }
                                altra.energia = 0; 
                                this.targetCreatura = null; 
                                this.huntingTimer = 0;
                                this.fatigue = Math.max(0, this.fatigue - 20); 

                                // LOG
                                logMessage(`CATTURA: Predatore ${this.id} ha mangiato Produttore ${altra.id}. E:${energiaGuadagnata.toFixed(0)}`, 'text-red-400');

                                break; 
                            }
                            // Cerca la preda più vicina (e più piccola)
                            else if (d < bestDistPreda && this.currentSize > altra.currentSize) { 
                                bestDistPreda = d;
                                if (this.targetCreatura !== altra) {
                                    this.targetCreatura = altra;
                                    foundNewTarget = true;
                                }
                            }
                        }
                        
                        if (foundNewTarget) {
                             this.huntingTimer = 0;
                        }
                    } else {
                         // Se troppo stanco o in riposo, non cacciare
                         this.targetCreatura = null; 
                    }


                    // 3. Cerca pellet (Sempre, anche se caccia, per mangiare se passa sopra, o se è stanco/in riposo)
                    let bestDistCibo = this.genetics.sense;
                    for (let i = energiaPunti.length - 1; i >= 0; i--) {
                        let pellet = energiaPunti[i];
                        let d = getDistance(this.x, this.y, pellet.x, pellet.y);

                        // Mangia pellet (meno efficiente)
                        if (!this.isResting && d < this.currentSize) { 
                            let energiaGuadagnata = ENERGIA_PER_PELLET * 0.5; 
                            
                            // 1. Ricarica Energia
                            this.energia = Math.min(this.energiaMax, this.energia + energiaGuadagnata);
                            
                            // 2. Crescita: Se è quasi pieno E non ha raggiunto la dimensione genetica, cresce lentamente.
                            if (this.currentSize < this.genetics.size && this.energia >= this.energiaMax * PREDATOR_GROWTH_THRESHOLD) {
                                this.currentSize = Math.min(this.genetics.size, this.currentSize + PREDATOR_SLOW_GROWTH_RATE);
                            }
                            
                            energiaPunti.splice(i, 1);
                        } 
                        // Cerca il più vicino
                        else if (d < bestDistCibo) {
                            bestDistCibo = d;
                            // Assegna targetNutriente solo se non sta cacciando attivamente.
                            // Oppure: Assegna sempre se è in riposo forzato O molto stanco.
                            if (this.isResting || this.fatigue >= FATIGUE_HUNT_THRESHOLD || this.targetCreatura === null) {
                                this.targetNutriente = pellet;
                            }
                        }
                    }
                }
            }

            /**
             * Logica di movimento (Fuggi, Caccia, Cerca Cibo, Vaga)
             */
            muovi() {
                // SE RIPOSO FORZATO: Movimento bloccato
                if (this.isResting) {
                    this.vx = 0;
                    this.vy = 0;
                    return; // Ferma il movimento
                }
                // Fine Riposo Forzato

                let GOTO_MULTIPLIER = 0.1;
                let FLEE_MULTIPLIER = 0.15; 
                
                // Calcola la velocità massima effettiva, ridotta dalla fatica (max riduzione del 50%)
                const fatigueFactor = 1 - (this.fatigue / MAX_FATIGUE) * 0.5;
                const effectiveSpeed = this.genetics.speed * fatigueFactor;


                // --- INIZIO CODICE DI FRENATA ---
                let d = Infinity;
                let target = this.fuggendoDa ? null : (this.targetCreatura ? this.targetCreatura : this.targetNutriente);
                
                if (target) {
                    d = getDistance(this.x, this.y, target.x, target.y);
                }
                // --- FINE CODICE DI FRENATA ---


                // Priorità 1: FUGGI (Applica fatica e accelera per fuggire)
                if (this.fuggendoDa) {
                    let dx = this.fuggendoDa.x - this.x;
                    let dy = this.fuggendoDa.y - this.y;
                    let angle = Math.atan2(dy, dx) + Math.PI; // Inverte l'angolo per fuggire
                    
                    this.vx += Math.cos(angle) * FLEE_MULTIPLIER;
                    this.vy += Math.sin(angle) * FLEE_MULTIPLIER;
                    
                    // Aumenta la fatica per la fuga
                    this.fatigue = Math.min(MAX_FATIGUE, this.fatigue + FATIGUE_FLEE_RATE);
                }
                // Priorità 2: AVVICINATI (Caccia o Cerca Cibo)
                else if (target) {
                    
                    // LOGICA DI GESTIONE FATICA QUANDO CERCANO UN TARGET:
                    if(this.targetNutriente) {
                         // Recupero più veloce quando si mira a una fonte di energia statica (riposo/recupero)
                         this.fatigue = Math.max(0, this.fatigue - FATIGUE_RECOVERY_RATE_PELLET);
                    } else if (this.targetCreatura && this.genetics.tipo === 'Predatore') {
                         // Costo di fatica ridotto per l'inseguimento
                         this.fatigue = Math.min(MAX_FATIGUE, this.fatigue + FATIGUE_HUNT_RATE);
                    } else {
                        // Recupero fatica standard (lento) se si è in uno stato "attivo" ma non critico
                        this.fatigue = Math.max(0, this.fatigue - FATIGUE_RECOVERY_RATE_REST * 0.5); 
                    }


                    // --- LOGICA DI MOVIMENTO ---
                    let dx = target.x - this.x;
                    let dy = target.y - this.y;
                    let angle = Math.atan2(dy, dx);

                    // Se siamo in "raggio di frenata", frena E accelera gentilmente.
                    if (d < this.currentSize * 5) {
                        this.vx *= 0.9; // Frena
                        this.vy *= 0.9;
                        this.vx += Math.cos(angle) * GOTO_MULTIPLIER * 0.5; // Tira gentilmente
                        this.vy += Math.sin(angle) * GOTO_MULTIPLIER * 0.5;
                    }
                    // Se siamo fuori dal raggio, accelera normalmente.
                    else {
                        this.vx += Math.cos(angle) * GOTO_MULTIPLIER;
                        this.vy += Math.sin(angle) * GOTO_MULTIPLIER;
                    }
                }
                // Priorità 3: VAGA (Wander)
                else {
                    // Recupera fatica velocemente quando non c'è nessun obiettivo critico
                    this.fatigue = Math.max(0, this.fatigue - FATIGUE_RECOVERY_RATE_REST);

                    if (Math.random() < 0.05) {
                        this.vx = random(-0.5, 0.5);
                        this.vy = random(-0.5, 0.5);
                    }
                }


                // Limita velocità (utilizzando effectiveSpeed che tiene conto della FATIGA)
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > effectiveSpeed) {
                    this.vx = (this.vx / speed) * effectiveSpeed;
                    this.vy = (this.vy / speed) * effectiveSpeed;
                }
                
                // Aggiorna posizione TESTA
                this.x += this.vx;
                this.y += this.vy;

                // Logica di movimento 'Serpente' o 'Flagello'
                if (this.genetics.forma === 'Serpente' || this.genetics.forma === 'Flagello') {
                    let leaderX = this.x;
                    let leaderY = this.y;
                    // Distanza fissa tra i segmenti, basata sulla dimensione
                    const segmentLen = this.currentSize * 0.8; // Usa currentSize

                    for (let seg of this.segmenti) {
                        let dx = leaderX - seg.x;
                        let dy = leaderY - seg.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        // Se il segmento è troppo lontano dal suo leader, si sposta
                        if (dist > segmentLen) {
                            let angle = Math.atan2(dy, dx);
                            // Si posiziona alla distanza corretta dal leader
                            seg.x = leaderX - Math.cos(angle) * segmentLen;
                            seg.y = leaderY - Math.sin(angle) * segmentLen;
                        }
                        // Il segmento attuale diventa il leader per il prossimo
                        leaderX = seg.x;
                        leaderY = seg.y;
                    }
                }

                // Aggiorna l'angolo di rotazione visiva (interpolazione smooth)
                if (speed > 0.1) {
                    let targetAngle = Math.atan2(this.vy, this.vx);
                    let diff = targetAngle - this.rotationAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    this.rotationAngle += diff * 0.1; // 'Lerp' 10%
                }

                // Rimbalza sui bordi (con un po' di inerzia)
                // MODIFICA: Logica di rimbalzo forzato per impedire di rimanere bloccati
                const bounceForce = 1.5; // Forza di rimbalzo aumentata
                const edgeMargin = 5; // Margine
                
                if (this.x < edgeMargin) {
                    this.vx = Math.abs(this.vx) * bounceForce + 0.1; // Forza il vx ad essere positivo (spingi a destra)
                } else if (this.x > canvas.width - edgeMargin) {
                    this.vx = -Math.abs(this.vx) * bounceForce - 0.1; // Forza il vx ad essere negativo (spingi a sinistra)
                }
                
                if (this.y < edgeMargin) {
                    this.vy = Math.abs(this.vy) * bounceForce + 0.1; // Forza il vy ad essere positivo (spingi in basso)
                } else if (this.y > canvas.height - edgeMargin) {
                    this.vy = -Math.abs(this.vy) * bounceForce - 0.1; // Forza il vy ad essere negativo (spingi in alto)
                }
                
                this.x = Math.max(0, Math.min(canvas.width, this.x));
                this.y = Math.max(0, Math.min(canvas.height, this.y));
            }

            /**
             * Costo della vita e gestione boost/riposo
             */
            vivi() {
                // --- NUOVA LOGICA DI RIPOSO FORZATO ---

                // FIX: Se l'energia è <= 0 (uccisa), esci subito.
                // Questo impedisce la rigenerazione nello stesso frame in cui è stata uccisa.
                if (this.energia <= 0) {
                    return; 
                }

                if (this.isResting) {
                    // Aumenta l'energia con il nuovo tasso più lento
                    this.energia = Math.min(this.energiaMax, this.energia + ENERGY_RECOVERY_RATE_RESTING);
                    
                    // Se raggiunge la soglia di ripresa, smette di riposare
                    if (this.energia >= ENERGY_RESUME_THRESHOLD) {
                        this.isResting = false;
                        this.wasResting = false; // Resetta il flag
                        logMessage(`RECUPERO: Creatura ${this.id} ha terminato il riposo. E:${this.energia.toFixed(0)}`, 'text-green-400');
                    }
                    return; // Il costo della vita è nullo quando in riposo forzato
                }

                // Se l'energia scende sotto la soglia di riposo, inizia a riposare
                if (this.energia < ENERGY_REST_THRESHOLD) {
                    this.isResting = true;
                    // Forziamo il recupero della fatica a zero per un reset
                    this.fatigue = 0; 
                    
                    // LOG
                    if (!this.wasResting) { // Registra solo la prima volta che entra in stop
                         logMessage(`STOP: Creatura ${this.id} (${this.genetics.tipo}) è in riposo forzato. E:${this.energia.toFixed(0)}`, 'text-yellow-400');
                         this.wasResting = true; // Impedisce log ripetuti
                    }
                    return; 
                }
                // --- FINE NUOVA LOGICA DI RIPOSO FORZATO ---


                // Il costo della vita è proporzionale a dimensione e velocità
                let costoBase = COSTO_VITA_PER_FRAME;
                let costoGenetico = (this.currentSize * 0.01) + (this.genetics.speed * 0.02); // Usa currentSize

                // I predatori pagano un costo energetico extra (ridotto a 1.2x)
                if (this.genetics.tipo === 'Predatore') {
                    costoGenetico *= PREDATOR_COST_MULTIPLIER;
                }

                this.energia -= (costoBase + costoGenetico);
                
                // Limita la fatica al massimo (non può superare MAX_FATIGUE)
                this.fatigue = Math.min(MAX_FATIGUE, this.fatigue);

                // Gestione del boost da "Select" utente
                if (this.boostRiproduttivo > 0) {
                    this.boostRiproduttivo--;
                    this.energia += (costoBase + costoGenetico) * 2; // Annulla il costo e dà energia extra
                    if (this.boostRiproduttivo % 10 === 0) {
                        this.riproduci(); // Tenta di riprodursi più spesso
                    }
                }
            }

            /**
             * Aggiornamento stato per frame
             */
            update() {
                // FIX: Interagisci PRIMA di pagare il costo della vita.
                // Questo permette alla creatura di mangiare anche se ha poca energia,
                // prima di bloccarsi in STOP.
                this.percepisciEInteragisci(); 
                this.vivi(); // Paga il costo DOPO aver mangiato
                
                // Se la creatura è stata appena uccisa, aggiorna lo stato di ispezione se era selezionata
                if (this.energia <= 0 && selectedCreature && selectedCreature.id === this.id) {
                    updateInspectionPanel();
                }

                this.muovi();
                this.riproduci(); // Tenta la riproduzione normale
            }

            /**
             * Disegna la creatura
             */
            draw() {
                const size = this.currentSize; // Usa la dimensione attuale per disegnare

                // Colore e bagliore in base alla genetica
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;

                // Logica bagliore (Effetto Tamagotchi)
                let glow = 15 + (this.energia / this.energiaMax) * 15;
                if (this.energia < this.energiaMax * 0.3) {
                    // Bagliore pulsante se affamato
                    glow += Math.sin(Date.now() * 0.01) * 10 + 10;
                }
                ctx.shadowBlur = glow;

                // Disegna la forma in base alla genetica
                switch(this.genetics.forma) {
                    case 'Cerchio':
                        this.drawCerchio(ctx, size);
                        break;
                    case 'Serpente':
                        this.drawSerpente(ctx, size);
                        break;
                    case 'Flagello':
                        this.drawFlagello(ctx, size);
                        break;
                }
                
                // Disegna indicatori di stato AI (Effetto Tamagotchi)
                ctx.shadowBlur = 0; // Nessun bagliore per il testo
                ctx.shadowColor = 'transparent'; // Impedisce al colore dell'ombra del corpo di influenzare il testo
                ctx.font = `${Math.max(10, size * 1.5)}px Inter`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // NUOVO INDICATORE: Riposo Forzato
                if (this.isResting) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; // Bianco: Riposo forzato
                    ctx.fillText('STOP', this.x, this.y - size - 5);
                } else if (this.fuggendoDa) {
                    ctx.fillStyle = 'rgba(255, 100, 100, 0.9)'; // Rosso: Fuga
                    ctx.fillText('!', this.x, this.y - size - 5);
                } else if (this.targetCreatura) {
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.9)'; // Arancione: Caccia
                    ctx.fillText('!!', this.x, this.y - size - 5);
                } else if (this.fatigue >= FATIGUE_HUNT_THRESHOLD) {
                    // Indicatore di 'riposo' per la fatica alta
                    ctx.fillStyle = 'rgba(100, 100, 255, 0.9)'; // Blu
                    ctx.fillText('zzZ', this.x, this.y - size - 5);
                }
                
                // Disegna la fatica (piccola linea rossa sopra)
                if (this.fatigue > 5 && !this.isResting) {
                    const barWidth = 10;
                    const barHeight = 2;
                    const faticaPercent = this.fatigue / MAX_FATIGUE;
                    const fillWidth = barWidth * faticaPercent;

                    // Sfondo (grigio scuro)
                    ctx.fillStyle = '#444';
                    ctx.fillRect(this.x - barWidth / 2, this.y - size - 15, barWidth, barHeight);
                    
                    // Riempimento (rosso)
                    ctx.fillStyle = '#f87171'; // Red 400
                    ctx.fillRect(this.x - barWidth / 2, this.y - size - 15, fillWidth, barHeight);
                }

                // Disegna il raggio di percezione se è boostato
                if (this.boostRiproduttivo > 0) {
                    ctx.strokeStyle = `hsla(${this.genetics.hue}, 100%, 80%, 0.3)`;
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.genetics.sense, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // --- MODALITÀ DEBUG ---
                if (debugMode) {
                    this.drawDebugInfo();
                }

                // Disegna l'evidenziazione se selezionata
                if (selectedCreature && selectedCreature.id === this.id && this.energia > 0) {
                    ctx.strokeStyle = '#facc15'; // Giallo
                    ctx.lineWidth = 2;
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#facc15';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.currentSize + 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0; // Resetta ombra
                }
            }
            
            /**
             * Disegna le informazioni genetiche in modalità debug
             * IMPORTANTE: Cancella un rettangolo dietro al testo per eliminare l'effetto "scia" del canvas.
             */
            drawDebugInfo() {
                // Imposta un contesto pulito per il testo
                ctx.shadowBlur = 0; 
                ctx.shadowColor = 'transparent'; 
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.font = '10px Inter';
                ctx.fillStyle = '#fff';

                const effectiveSpeed = this.isResting ? 0 : this.genetics.speed * (1 - (this.fatigue / MAX_FATIGUE) * 0.5);
                const status = this.isResting ? 'RIPOSO FORZATO' : (this.fuggendoDa ? 'IN FUGA' : (this.targetCreatura ? 'IN CACCIA' : (this.targetNutriente ? 'CERCA CIBO' : 'VAGA')));

                const offset = this.currentSize * 2 + 10;
                const lineHeight = 12;
                const lines = [
                    `Stato: ${status}`,
                    `Tipo: ${this.genetics.tipo} (${this.genetics.forma})`,
                    `G-Size: ${this.genetics.size.toFixed(1)} / A-Size: ${this.currentSize.toFixed(1)}`,
                    `Velocità: ${this.genetics.speed.toFixed(2)} (Eff: ${effectiveSpeed.toFixed(2)})`, 
                    `Energia: ${this.energia.toFixed(0)}/${this.energiaMax.toFixed(0)}`,
                    `Fatigue: ${this.fatigue.toFixed(0)}/${MAX_FATIGUE}`,
                    ...(this.genetics.tipo === 'Predatore' ? [`Hunt Timer: ${this.huntingTimer}`] : [])
                ];

                const totalHeight = lines.length * lineHeight;
                const padding = 2;
                const textWidth = 150; // Larghezza fissa per la cancellazione

                // 1. CANCELLA IL RETTANGOLO SOTTOSTANTE
                // Usa lo stesso colore di sfondo del canvas (rgba(5, 5, 10, 1.0)) ma con opacità 1.0 (opaca)
                ctx.fillStyle = 'rgb(5, 5, 10)'; 
                ctx.fillRect(this.x + offset - padding, this.y - 20 - padding, textWidth + padding * 2, totalHeight + padding * 2);
                
                // 2. DISEGNA IL TESTO
                ctx.fillStyle = '#fff';
                lines.forEach((line, index) => {
                    ctx.fillText(line, this.x + offset, this.y + index * lineHeight - 20);
                });
            }

            /**
             * Helper per disegnare un segmento di corpo
             */
            drawSegment(ctx, x, y, size, angle, distance) {
                let drawX = x - Math.cos(angle) * distance;
                let drawY = y - Math.sin(angle) * distance;
                ctx.beginPath();
                ctx.arc(drawX, drawY, size, 0, Math.PI * 2);
                ctx.fill();
            }

            /**
             * Disegna la forma 'Cerchio' (standard)
             */
            drawCerchio(ctx, size) {
                // Corpo
                this.drawSegment(ctx, this.x, this.y, size, this.rotationAngle, 0);
                // Coda (Usa tailLength)
                const tailDist = size * 1.5 * this.genetics.tailLength; // Applica il gene
                this.drawSegment(ctx, this.x, this.y, size * 0.5, this.rotationAngle, tailDist);
            }

            /**
             * Disegna la forma 'Serpente' (segmentata fluida)
             */
            drawSerpente(ctx, size) {
                const originalColor = this.color; // Salva colore
                const isPredator = this.genetics.tipo === 'Predatore';
                const stripeColor = `hsl(${this.genetics.hue}, 100%, 50%)`; // Colore striscia (più scuro/rosso)

                // Disegna prima i segmenti della coda
                let currentSize = size * 0.9; 
                for (let i = 0; i < this.segmenti.length; i++) { // Cambia loop
                    let seg = this.segmenti[i];
                    
                    // Applica strisce se predatore
                    if (isPredator) {
                        ctx.fillStyle = (i % 2 === 0) ? originalColor : stripeColor;
                    }

                    currentSize *= 0.98; 
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, Math.max(1, currentSize), 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.fillStyle = originalColor; // Ripristina colore per la testa
                // Disegna la testa (l'origine) per ultima, in modo che sia sopra
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2); 
                ctx.fill();
            }

            /**
             * Disegna la forma 'Flagello' (segmentata con ondulazione)
             */
            drawFlagello(ctx, size) {
                const originalColor = this.color; // Salva colore
                const isPredator = this.genetics.tipo === 'Predatore';
                const stripeColor = `hsl(${this.genetics.hue}, 100%, 50%)`; // Colore striscia (più scuro/rosso)

                let currentSize = size * 0.9;
                let leader = { x: this.x, y: this.y };

                for (let i = 0; i < this.segmenti.length; i++) {
                    let seg = this.segmenti[i];
                    
                    // Applica strisce se predatore
                    if (isPredator) {
                        ctx.fillStyle = (i % 2 === 0) ? originalColor : stripeColor;
                    }
                    
                    // Calcola l'angolo verso il segmento leader
                    let angleToLeader = Math.atan2(leader.y - seg.y, leader.x - seg.x);
                    if (isNaN(angleToLeader)) angleToLeader = 0;

                    // Calcola l'offset perpendicolare per l'ondulazione
                    let perpAngle = angleToLeader + Math.PI / 2;
                    // L'ondulazione è più forte verso la fine della coda
                    let wobbleFactor = (i / this.segmenti.length) * size * 0.7;
                    let wobble = Math.sin(Date.now() * 0.01 + i * 0.5) * wobbleFactor;

                    let drawX = seg.x + Math.cos(perpAngle) * wobble;
                    let drawY = seg.y + Math.sin(perpAngle) * wobble;

                    currentSize *= 0.97; 
                    ctx.beginPath();
                    ctx.arc(drawX, drawY, Math.max(1, currentSize), 0, Math.PI * 2);
                    ctx.fill();

                    leader = seg; 
                }
                
                ctx.fillStyle = originalColor; // Ripristina colore per la testa
                // Disegna la testa (l'origine) per ultima, in modo che sia sopra
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }

        /**
         * Funzione di Inizializzazione
         */
        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            creature = [];
            creatureIdCounter = 0; // Resetta il contatore ID
            // Bilanciamento 4:1
            const numPredatori = Math.floor(NUMERO_INIZIALE_CREATURE / 5); // 20%
            const numProduttori = NUMERO_INIZIALE_CREATURE - numPredatori; // 80%

            for (let i = 0; i < numProduttori; i++) {
                creature.push(new Creatura(random(0, canvas.width), random(0, canvas.height), {
                    tipo: 'Produttore',
                    hue: random(180, 240), 
                    size: random(3, 8),
                    speed: random(0.5, 2),
                    sense: random(50, 150),
                    forma: FORMES_DISPONIBILI[Math.floor(Math.random() * FORMES_DISPONIBILI.length)],
                    tailLength: random(0.8, 1.5) // Gene Coda
                }));
            }
            for (let i = 0; i < numPredatori; i++) {
                creature.push(new Creatura(random(0, canvas.width), random(0, canvas.height), {
                    tipo: 'Predatore',
                    hue: random(30, 60), 
                    size: random(4, 9), // Leggermente più grandi
                    speed: random(0.8, 2.5), // Leggermente più veloci
                    sense: random(70, 160), // Vista migliore
                    forma: FORMES_DISPONIBILI[Math.floor(Math.random() * FORMES_DISPONIBILI.length)],
                    tailLength: random(0.8, 1.5) // Gene Coda
                }));
            }
            
            energiaPunti = [];
            for (let i = 0; i < NUMERO_INIZIALE_ENERGIA; i++) {
                energiaPunti.push(new EnergiaPellet());
            }

            // Nasconde le istruzioni dopo un po'
            setTimeout(() => {
                document.getElementById('controlsInfo').style.opacity = '0';
            }, 5000);

            logMessage(`Inizializzazione completata. Creati ${numProduttori} Produttori e ${numPredatori} Predatori.`, 'text-white');
        }

        /**
         * Loop di Animazione Principale
         */
        function animate() {
            // NUOVO: Gestione Pausa
            if (isPaused) {
                requestAnimationFrame(animate); // Continua a chiamare animate per mantenere il loop, ma salta l'update
                return;
            }

            // Pulisce il canvas con effetto "scia" (opacità aumentata per sbiadire più velocemente)
            ctx.fillStyle = 'rgba(5, 5, 10, 0.25)'; // Era 0.15
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Resetta il bagliore per evitare che si applichi allo sfondo
            ctx.shadowBlur = 0;

            // Aggiunge un po' di energia passivamente
            if (Math.random() < 0.15) { 
                energiaPunti.push(new EnergiaPellet());
            }
            // Limita i pellet di energia
            if (energiaPunti.length > 250) {
                energiaPunti.splice(0, energiaPunti.length - 250);
            }

            // Aggiorna e disegna energia
            energiaPunti.forEach(n => {
                n.update(); // Aggiorna posizione fluttuante
                n.draw();
            });
            
            // Aggiorna e disegna forme di vita
            for (let i = creature.length - 1; i >= 0; i--) {
                let c = creature[i];
                c.update();
                c.draw();

                // Morte (per fame o predazione)
                if (c.energia <= 0) {
                    const tipoCreaturaMorta = c.genetics.tipo;
                    const creaturaID = c.id;
                    logMessage(`MORTE: Creatura ${creaturaID} (${tipoCreaturaMorta}) è morta.`, 'text-red-600');
                    
                    // Rilascia un po' di energia alla morte (più generoso)
                    for(let j=0; j < c.currentSize; j++) { 
                        energiaPunti.push(new EnergiaPellet(c.x + random(-5,5), c.y + random(-5,5)));
                    }
                    creature.splice(i, 1);

                    // LOGICA DI BILANCIAMENTO 4:1
                    const produttori = creature.filter(cr => cr.genetics.tipo === 'Produttore').length;
                    const predatori = creature.filter(cr => cr.genetics.tipo === 'Predatore').length;
                    const ratio = (predatori > 0) ? produttori / predatori : produttori;

                    let tipoDaSpawnare;
                    if (ratio < 4.0 || predatori === 0) {
                        tipoDaSpawnare = 'Produttore';
                    } else {
                        // Se il rapporto è buono, 70% chance di spawnare un produttore
                        tipoDaSpawnare = (Math.random() < 0.7) ? 'Produttore' : 'Predatore';
                    }

                    const forme = FORMES_DISPONIBILI;
                    const newGenetics = { 
                        tipo: tipoDaSpawnare, 
                        hue: (tipoDaSpawnare === 'Produttore') ? random(180, 240) : random(30, 60), 
                        size: random(3, 8), 
                        speed: random(0.5, 2), 
                        sense: random(50, 150), 
                        forma: forme[Math.floor(Math.random() * forme.length)],
                        tailLength: random(0.8, 1.5) // Gene Coda
                    };
                    const nuovaCreatura = new Creatura(random(0, canvas.width), random(0, canvas.height), newGenetics);
                    creature.push(nuovaCreatura);
                    
                    logMessage(`RESPAWN: Creato ${tipoDaSpawnare} (ID: ${nuovaCreatura.id}). Ratio attuale: ${ratio.toFixed(1)}:1`, 'text-cyan-400');
                }
            }
            
            // Rimuove il vecchio "collapse" check - ora il respawn è costante
            
            // Limita la popolazione per performance
            if (creature.length > 150) { 
                 // Rimuove la creatura più affamata (e quindi con meno energia)
                 creature.sort((a, b) => a.energia - b.energia);
                 const rimossa = creature.splice(0, 1)[0]; 
                 logMessage(`OVERPOP: Rimossa creatura ${rimossa.id} per sovrappopolazione.`, 'text-gray-500');
            }

            // Aggiorna il pannello di ispezione se una creatura è selezionata
            if (selectedCreature) {
                updateInspectionPanel();
            }

            // --- NUOVO: Aggiornamento Contatori Log ---
            // Conta solo se il pannello è visibile per risparmiare performance
            if (!document.getElementById('logPanelContainer').classList.contains('hidden')) {
                const produttori = creature.filter(cr => cr.genetics.tipo === 'Produttore').length;
                const predatori = creature.filter(cr => cr.genetics.tipo === 'Predatore').length;
                document.getElementById('count-produttori').textContent = produttori;
                document.getElementById('count-predatori').textContent = predatori;
                document.getElementById('count-cibo').textContent = energiaPunti.length;
            }
            // --- Fine Aggiornamento Contatori ---

            requestAnimationFrame(animate);
        }
        
        // --- Gestione Input Utente (Click Canvas) ---

        function handleClick(e) {
            // "Aggiungi Energia": crea pellet nel punto del click
            // MODIFICATO: Ora gestisce Ispezione vs Aggiungi Cibo
            let clickX = e.clientX;
            let clickY = e.clientY;

            let bestDist = Infinity;
            let nearestCreature = null;

            // Trova la creatura più vicina al click
            for (let c of creature) {
                // Converte le coordinate del canvas (potrebbe essere scalato)
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const canvasX = (clickX - rect.left) * scaleX;
                const canvasY = (clickY - rect.top) * scaleY;
                
                let d = getDistance(canvasX, canvasY, c.x, c.y);
                if (d < bestDist) {
                    bestDist = d;
                    nearestCreature = c;
                }
            }

            // Se il click è abbastanza vicino a una creatura (raggio generoso), la seleziona
            if (nearestCreature && bestDist < nearestCreature.currentSize * 3 + 10) {
                selectedCreature = nearestCreature;
                updateInspectionPanel();
                inspectionPanel.classList.remove('hidden');
                logMessage(`ISPEZIONE: Selezionata creatura ${selectedCreature.id}`, 'text-white');
            } else {
                // Altrimenti, aggiunge cibo
                for (let i = 0; i < ENERGIA_CLICK; i++) {
                    energiaPunti.push(new EnergiaPellet(e.clientX + random(-10, 10), e.clientY + random(-10, 10)));
                }
                // Deseleziona se si clicca sul vuoto
                selectedCreature = null;
                inspectionPanel.classList.add('hidden');
            }
        }
        
        function handleLongPress(e) {
            // "Seleziona": trova la creatura più vicina e le dà un boost
            let bestDist = Infinity;
            let selectedCreatureForBoost = null;
            
            for(let c of creature) {
                // Converte le coordinate del canvas (potrebbe essere scalato)
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const canvasX = (e.clientX - rect.left) * scaleX;
                const canvasY = (e.clientY - rect.top) * scaleY;
                
                let d = getDistance(canvasX, canvasY, c.x, c.y);
                if (d < bestDist && d < 100) { // Cerca in un raggio di 100px
                    bestDist = d;
                    selectedCreatureForBoost = c;
                }
            }
            
            if (selectedCreatureForBoost) {
                // Attiva il "boost riproduttivo" per 300 frame
                selectedCreatureForBoost.boostRiproduttivo = 300; 
                logMessage(`BOOST: Attivato boost riproduttivo per ${selectedCreatureForBoost.id}`, 'text-purple-400');
            }
        }
        
        // --- Gestione Tasti (D, L, P, I) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'd' || e.key === 'D') {
                debugMode = !debugMode;
                debugIndicator.classList.toggle('hidden', !debugMode);
                e.preventDefault(); 
            }
            // Toggle per il pannello di log
            if (e.key === 'l' || e.key === 'L') {
                document.getElementById('logPanelContainer').classList.toggle('hidden');
                e.preventDefault();
            }
            
            // NUOVO: Toggle per Pausa (P)
            if (e.key === 'p' || e.key === 'P') {
                isPaused = !isPaused;
                logMessage(isPaused ? "Simulazione IN PAUSA" : "Simulazione RIPRESA", 'text-white');
                // Mostra/Nascondi indicatore di pausa
                document.getElementById('pauseIndicator').classList.toggle('hidden', !isPaused);
                e.preventDefault();
            }

            // NUOVO: Toggle per Ispezione (I)
            if (e.key === 'i' || e.key === 'I') {
                if (selectedCreature) { // Funziona solo se una creatura è già selezionata
                    inspectionPanel.classList.toggle('hidden');
                }
                e.preventDefault();
            }
        });

        // Gestore per i click (per evitare che il click sul pannello attivi il canvas)
        document.getElementById('creationPanel').addEventListener('mousedown', (e) => {
            e.stopPropagation();
        });
        document.getElementById('creationPanel').addEventListener('mouseup', (e) => {
            e.stopPropagation();
        });
        document.getElementById('creationToggle').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('creationPanel').classList.toggle('hidden');
        });
        
        // NUOVO: Gestori per chiudere i pannelli UI
        document.getElementById('inspectionClose').addEventListener('click', (e) => {
            e.stopPropagation();
            inspectionPanel.classList.add('hidden');
            selectedCreature = null; // Deseleziona
        });


        canvas.addEventListener('mousedown', (e) => {
            pressStartTime = Date.now();
            pressTimer = setTimeout(() => {
                // Se il timer scatta, è un click lungo
                handleLongPress(e);
                pressTimer = null; // Resetta il timer
            }, LONG_PRESS_DURATION);
        });

        canvas.addEventListener('mouseup', (e) => {
            if (pressTimer) {
                // Se il timer è ancora attivo al rilascio, era un click corto
                clearTimeout(pressTimer);
                pressTimer = null;
                
                // Evita di registrare un click se il mouse si è mosso troppo
                if (Date.now() - pressStartTime < LONG_PRESS_DURATION) {
                     handleClick(e);
                }
            }
        });

        // --- Gestione UI Creazione ---

        document.getElementById('createButton').addEventListener('click', () => {
            const tipo = document.getElementById('selectTipo').value;
            const forma = document.getElementById('selectForma').value;

            // Crea la creatura al centro dello schermo
            const x = canvas.width / 2 + random(-50, 50);
            const y = canvas.height / 2 + random(-50, 50);

            const newGenetics = {
                tipo: tipo,
                hue: (tipo === 'Produttore') ? random(180, 240) : random(30, 60), 
                size: random(5, 10), // Creato manualmente un po' più grande
                speed: random(0.5, 2),
                sense: random(70, 150),
                forma: forma,
                tailLength: random(0.8, 1.5) // Gene Coda
            };

            const nuovaCreatura = new Creatura(x, y, newGenetics);
            creature.push(nuovaCreatura);
            logMessage(`CREAZIONE MANUALE: Creato ${tipo} (ID: ${nuovaCreatura.id})`, 'text-white');

            // Chiudi il pannello
            document.getElementById('creationPanel').classList.add('hidden');
        });

        /**
         * NUOVA FUNZIONE: Aggiorna il pannello di ispezione
         */
        function updateInspectionPanel() {
            if (!selectedCreature || selectedCreature.energia <= 0) {
                inspectionPanel.classList.add('hidden');
                selectedCreature = null;
                return;
            }

            const gen = selectedCreature.genetics;
            const status = selectedCreature.isResting ? 'STOP (Riposo)' : (selectedCreature.fuggendoDa ? 'IN FUGA' : (selectedCreature.targetCreatura ? 'IN CACCIA' : (selectedCreature.targetNutriente ? 'CERCA CIBO' : 'VAGA')));
            const effectiveSpeed = selectedCreature.isResting ? 0 : gen.speed * (1 - (selectedCreature.fatigue / MAX_FATIGUE) * 0.5);

            inspectionTitle.textContent = `Info Creatura (ID: ${selectedCreature.id})`;
            inspectionContent.innerHTML = `
                <div class="stat-row"><span>Stato</span><span style="color: ${selectedCreature.color};">${status}</span></div>
                <div class="stat-row"><span>Tipo</span><span>${gen.tipo}</span></div>
                <div class="stat-row"><span>Forma</span><span>${gen.forma}</span></div>
                <div class="stat-row"><span>Energia</span><span>${selectedCreature.energia.toFixed(1)} / ${selectedCreature.energiaMax.toFixed(0)}</span></div>
                <div class="stat-row"><span>Fatica</span><span>${selectedCreature.fatigue.toFixed(1)} / ${MAX_FATIGUE}</span></div>
                <div class="stat-row"><span>Dimensione (Att/Gen)</span><span>${selectedCreature.currentSize.toFixed(1)} / ${gen.size.toFixed(1)}</span></div>
                <div class="stat-row"><span>Velocità (Eff/Gen)</span><span>${effectiveSpeed.toFixed(2)} / ${gen.speed.toFixed(2)}</span></div>
                <div class="stat-row"><span>Percezione</span><span>${gen.sense.toFixed(0)}</span></div>
                <div class="stat-row"><span>Lungh. Coda (Gene)</span><span>${gen.tailLength.toFixed(2)}</span></div>
                <div class="stat-row"><span>Timer Caccia</span><span>${selectedCreature.huntingTimer}</span></div>
                <div class="stat-row"><span>Boost</span><span>${selectedCreature.boostRiproduttivo}</span></div>
            `;
        }


        // Gestione resize finestra
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            logMessage('Canvas ridimensionato.', 'text-gray-500');
        });

        // Avvio
        init();
        animate();

    </script>
</body>
</html>
